<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#007AFF">
    <title>UNICEP Portal</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <style>
        html, body, #ComposeTarget {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #F2F2F7;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            html, body, #ComposeTarget { background: #000000; color: #FFFFFF; }
        }
        #loader {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 14px;
            opacity: 0.7;
            pointer-events: none;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 2.5px solid rgba(0, 122, 255, 0.25);
            border-top-color: #007AFF;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <span>Carregando UNICEP Portal...</span>
    </div>
    <div id="ComposeTarget"></div>
    <script type="application/javascript" src="unicep-portal.js"></script>
    <script type="application/javascript" src="loader.js"></script>
</body>
</html>
