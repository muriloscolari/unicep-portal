services:
  unicep-portal:
    image: git.muriloscolari.me/murilo/unicep-portal:latest
    pull_policy: always
    container_name: unicep-portal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    env_file:
      - path: .env
        required: true
    environment:
      PORT: ${PORT:-47832}
      REQUIRE_SECRET: "true"
      APP_SECRET: "${APP_SECRET:?Defina APP_SECRET com pelo menos 32 caracteres no .env}"
      CORS_ORIGIN: ${CORS_ORIGIN:-https://unicep.muriloscolari.me}
      ALLOW_DEV_CORS: "false"
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/8,::1/128,172.16.0.0/12}
      DATA_DIR: /app/data
      WEB_DIR: /app/web
      POLL_INTERVAL_MINUTES: ${POLL_INTERVAL_MINUTES:-15}
      NOTIFY_ABSENCES: ${NOTIFY_ABSENCES:-true}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-47832}:47832"
    volumes:
      - ./data:/app/data

  # Atualiza automaticamente apenas o container unicep-portal quando houver nova imagem no Forgejo
  watchtower:
    image: containrrr/watchtower:latest
    container_name: unicep-watchtower
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.44"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      TZ: America/Sao_Paulo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Repositório/pacote público no Forgejo (sem necessidade de login no homelab)
